<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form action="" method="get">

        <label>Gender:</label>

        <input type="radio" name="gen" id="male" value="Male">
        <label for="male">Male</label>

        <input type="radio" name="gen" id="female" value="Female">
        <label for="female">Female</label>

        <br><br>

        <label>Skills:</label>

        <input type="checkbox" name="skills" id="java" value="Java">
        <label for="java">Java</label>

        <input type="checkbox" name="skills" id="python" value="Python">
        <label for="python">Python</label>

        <input type="checkbox" name="skills" id="csharp" value="C#">
        <label for="csharp">C#</label>

        <input type="checkbox" name="skills" id="angular" value="Angular">
        <label for="angular">Angular</label>

        <br><br>

        <input type="submit" value="Sign Up">

    </form>
    

    <h1>List Of Cities:</h1>

    <ul>
        <li>Maharashtra
            <ol>
                <li>Pune</li>
                <li>Mumbai</li>
                <li>Nashik</li>
                <li>Nagpur</li>
                <li>Thane</li>
                <li>Kolhapur</li>
                <li>Amravati</li>
                <li>Satara</li>
                <li>Jalgaon</li>
                <li>Ahilyanagar</li>
            </ol>
        </li>
    </ul>

    
    
</body>
</html>
